[package]
name = "resup"
description = "A command-line interface for Real-ESRGAN."
authors = ["Konstantin Zhigaylo <zero@kostyazero.com>"]
keywords = ["realesrgan", "upscale"]
readme = "README.md"
repository = "https://github.com/kostya-zero/resup"
license = "MIT"
version = "0.4.0-dev"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.0", features = ["derive"] }
colored = "3.1.1"
dialoguer = { version = "0.12.0", features = ["history"] }
dir_spec = "0.5.2"
home = "0.5.12"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[profile.release]
lto = "thin"
opt-level = 2
codegen-units = 1
